services:

  postgres:
    image: postgres:17-alpine
    container_name: tesla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tesla_pool
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla -d tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 5

